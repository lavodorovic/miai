name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests (no browser e2e)
        run: >
          python -m pytest tests/
          --tb=short -q
          --ignore=tests/test_e2e_streamlit_period_dashboard.py
          --ignore=tests/test_e2e_streamlit_bottleneck_radar.py
